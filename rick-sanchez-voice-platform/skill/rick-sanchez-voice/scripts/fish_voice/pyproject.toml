[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fish-voice"
version = "0.2.0"
description = "Zero-dependency Fish Audio TTS client (sync + WebSocket streaming)"
requires-python = ">=3.10"
dependencies = ["websockets>=12.0"]

[project.scripts]
rick-tts = "fish_voice.cli:main"

[tool.setuptools.packages.find]
include = ["fish_voice*"]
