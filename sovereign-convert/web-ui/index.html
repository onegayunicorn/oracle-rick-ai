<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sovereign Convert</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main>
    <h1>Sovereign Convert</h1>
    <p class="sub">EXE → PWA → APK. Fully offline. Your files never leave your device.</p>
    <div id="dropzone" class="dropzone">
      <p>Drop an .exe / .msi / .zip here, or <label class="browse">browse<input type="file" id="file" hidden /></label></p>
    </div>
    <div id="status"></div>
    <div id="result"></div>
  </main>
  <script src="app.js"></script>
</body>
</html>
