[project]
name = "rick-voice-prosody"
version = "1.1.0"
description = "Rick C-137 audio personality DSP (post-Piper)"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "librosa>=0.10",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
