global:
  scrape_interval: 15s
scrape_configs:
  - job_name: 'nexus-engine'
    static_configs:
      - targets: ['backend:3000']
        labels: { service: 'nexus' }
  - job_name: 'piper-tts'
    static_configs:
      - targets: ['piper-tts:8000']
  - job_name: 'caddy'
    static_configs:
      - targets: ['caddy:2019']
